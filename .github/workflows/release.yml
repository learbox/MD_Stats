name: Release

on:
  push:
    tags:
      - 'v*.*.*'          # 推送 v1.4.0 这类 tag 时触发
  workflow_dispatch:       # 允许手动触发

permissions:
  contents: write          # 允许创建 Release

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 uv（含 Python 3.15）
        uses: astral-sh/setup-uv@v10.3.0  # 该 action 无浮动 major tag，必须写精确版本
        with:
          python-version: '3.15'

      - name: 同步依赖（按 uv.lock 精确复现）
        run: uv sync --frozen

      - name: 编译 .ui 文件
        run: uv run pyside6-uic ui/main_window.ui -o ui/main_window_ui.py

      - name: PyInstaller 打包（内联 spec，自动排除未用 Qt 模块、多语翻译和 OpenCV FFmpeg）
        shell: pwsh
        run: |
          @'
          # -*- mode: python ; coding: utf-8 -*-

          _UNUSED_QT_DLLS = [
              'qt6quick', 'qt6qml', 'qt6pdf', 'qt6svg',
              'qt6virtualkeyboard', 'qt6network',
              'qt63d', 'qt6opengl', 'opengl32sw',
              'qt6webchannel', 'qt6webengine', 'qt6websockets',
              'qt6bluetooth', 'qt6nfc', 'qt6serialport',
              'qt6multimedia', 'qt6sensors', 'qt6positioning',
              'qt6printsupport', 'qt6help', 'qt6sql', 'qt6test',
              'qt6concurrent', 'qt6dbus',
              'qt6designer', 'qt6axcontainer',
          ]

          # 程序只用 OpenCV 做图像解码/编码与模板匹配，不涉及视频读写。
          # PyInstaller 的 hook-cv2 会无条件收集 cv2 包内的 ffmpeg 解码器 DLL（约 39 MB），
          # 对未使用 cv2.VideoCapture / cv2.VideoWriter 的本程序而言纯属冗余。
          _UNUSED_OPENCV_DLLS = ['opencv_videoio_ffmpeg']

          # 未使用的 PySide6 插件目录（相对 PySide6/plugins/）。
          # 程序不用 Qt 网络（更新检查走 Python urllib）、虚拟键盘、触摸输入和原生样式。
          _UNUSED_QT_PLUGIN_DIRS = (
              'tls/', 'networkinformation/', 'platforminputcontexts/',
              'iconengines/', 'generic/', 'styles/',
          )

          # QtNetwork 绑定：项目不用 Qt 网络功能。
          # libcrypto-3-x64.dll / libssl-3-x64.dll：PyInstaller 从 Git for Windows 的
          # PATH 目录误收集的 OpenSSL；Python 自带的 libcrypto-3.dll / libssl-3.dll 保留。
          _UNUSED_RUNTIME_DLLS = (
              'pyside6/qtnetwork.pyd',
              'libcrypto-3-x64.dll',
              'libssl-3-x64.dll',
          )

          import os as _os, glob as _glob, shutil as _sh
          import PySide6
          _pydir = _os.path.dirname(PySide6.__file__)
          # 只收集中文翻译（qt_zh_CN.qm 是聚合文件，需要子模块 *_zh_CN.qm 才能加载）
          _tl_tmp = '_tmp_translations'
          _os.makedirs(_tl_tmp, exist_ok=True)
          for _f in _glob.glob(_os.path.join(_pydir, 'translations/*zh_CN*')):
              _sh.copy(_f, _tl_tmp)


          def _drop_binary(name):
              """判断 PyInstaller 收集的二进制/插件是否属于可剔除项。"""
              low = name.lower().replace('\\', '/')
              if any(kw in low for kw in _UNUSED_QT_DLLS + _UNUSED_OPENCV_DLLS):
                  return True
              if any(kw in low for kw in _UNUSED_RUNTIME_DLLS):
                  return True
              # OpenBLAS 在根目录和 numpy.libs 各有一份，只保留 numpy.libs 内的
              if 'libscipy_openblas' in low and 'numpy.libs/' not in low:
                  return True
              # 平台插件只留 qwindows；图片格式插件只留 qico（PNG 为 QtGui 内置）
              if '/plugins/platforms/' in low and not low.endswith('/qwindows.dll'):
                  return True
              if '/plugins/imageformats/' in low and not low.endswith('/qico.dll'):
                  return True
              if any('/plugins/' + d in low for d in _UNUSED_QT_PLUGIN_DIRS):
                  return True
              return False
          a = Analysis(
              ['main.py'],
              pathex=[],
              binaries=[],
              datas=[(_tl_tmp, 'PySide6/translations')],
              hiddenimports=['PySide6.QtXml'],  # Qt 翻译解析 .qm 文件需要
              hookspath=[],
              hooksconfig={},
              runtime_hooks=[],
              excludes=[],
              noarchive=False,
              optimize=0,
          )
          a.binaries = [
              (name, path, typ) for name, path, typ in a.binaries
              if not _drop_binary(name)
          ]
          # PySide6 的 hook 可能自动带上 WebEngine 用的 ICU 数据（约 10 MB），项目已排除 WebEngine
          a.datas = [
              (name, path, typ) for name, path, typ in a.datas
              if not name.lower().replace('\\', '/').endswith('resources/icudtl.dat')
          ]
          pyz = PYZ(a.pure)

          exe = EXE(
              pyz,
              a.scripts,
              [],
              exclude_binaries=True,
              name='MD Stats',
              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=False,
              console=False,
              disable_windowed_traceback=False,
              argv_emulation=False,
              target_arch=None,
              codesign_identity=None,
              entitlements_file=None,
              icon=['app_icon.ico'],
              contents_directory='.runtime',
          )
          coll = COLLECT(
              exe,
              a.binaries,
              a.datas,
              strip=False,
              upx=False,
              upx_exclude=[],
              name='MD Stats',
          )

          '@ | Set-Content "MD Stats.spec" -Encoding UTF8

          uv run --with 'pyinstaller>=6.22,<7' pyinstaller "MD Stats.spec" --noconfirm

      - name: 组装发布目录
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          $release = "dist/release"
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          Copy-Item "dist/MD Stats/MD Stats.exe" $release
          Copy-Item -Recurse "dist/MD Stats/.runtime" $release
          Copy-Item -Recurse csv $release
          Copy-Item -Recurse resource $release
          # 默认配置由代码模板现场生成（仓库不再跟踪 config.toml，保证内容与代码一致）
          uv run python -c "from pathlib import Path; from src.config import generate_default_config; generate_default_config(Path('dist/release/config.toml'))"
          # 初始布局预置：列宽/分割比例（不含窗口位置，由程序首启后自行记录）
          uv run python -c "from pathlib import Path; from src.app_state import generate_initial_state; generate_initial_state(Path('dist/release/.app_state.toml'))"
          Copy-Item docs/README_release.md "$release/README.md"
          Copy-Item docs/TROUBLESHOOTING.md $release
          Copy-Item LICENSE $release
          Get-ChildItem -Path $release -Recurse -Include __pycache__ -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path $release -Recurse -Filter *.pyc -Force | Remove-Item -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$release/*" -DestinationPath "dist/MD Stats-$tag.zip" -CompressionLevel Optimal

      - name: 上传 ZIP 为构建产物（非 tag 时在此下载）
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v7
        with:
          name: MD Stats-${{ github.ref_name }}
          path: dist/MD Stats-${{ github.ref_name }}.zip

      - name: 创建 GitHub Release（草稿，仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/MD Stats-${{ github.ref_name }}.zip
          name: MD Stats ${{ github.ref_name }}
          draft: true
